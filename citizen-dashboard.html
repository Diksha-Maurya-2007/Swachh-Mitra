<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Citizen Dashboard – Swachh Mitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Citizen Dashboard Specific Styling ──────────────────── */
    .citizen-hero-card {
      background: linear-gradient(135deg, #1a3a5c 0%, #0f2540 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }
    .citizen-hero-card::after {
      content: '';
      position: absolute;
      right: -40px;
      bottom: -40px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }
    .citizen-hero-content {
      max-width: 650px;
      position: relative;
      z-index: 1;
    }
    .citizen-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 12px;
    }
    .citizen-hero-title {
      font-size: 1.6rem;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .citizen-hero-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .citizen-hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ── Top Ranked Area Spotlight ───────────────────────────── */
    .top-area-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1.5px solid #fde68a;
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .top-area-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .top-trophy-box {
      width: 54px;
      height: 54px;
      background: #fef08a;
      border: 2px solid #f59e0b;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(245,158,11,0.2);
    }
    .top-area-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: #92400e;
      letter-spacing: -0.02em;
    }
    .top-area-meta {
      font-size: 0.8rem;
      color: #b45309;
      margin-top: 2px;
    }
    .top-area-score-box {
      text-align: right;
    }
    .top-area-score-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: #16a34a;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .top-area-score-lbl {
      font-size: 0.72rem;
      font-weight: 700;
      color: #b45309;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    /* ── Leaderboard Table ───────────────────────────────────── */
    .rank-table-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .rank-table-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border);
      gap: 16px;
      flex-wrap: wrap;
    }
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .rank-table th {
      padding: 12px 18px;
      background: var(--color-bg);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      border-bottom: 1px solid var(--color-border);
    }
    .rank-table td {
      padding: 16px 18px;
      font-size: 0.86rem;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
      vertical-align: middle;
    }
    .rank-table tr:last-child td {
      border-bottom: none;
    }
    .rank-table tr:hover td {
      background: rgba(241,245,249,0.5);
    }
    .rank-medal-badge {
      font-size: 1.1rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
    }
    .area-score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .area-score-pill.high { background: #dcfce7; color: #15803d; }
    .area-score-pill.med  { background: #fef3c7; color: #b45309; }
    .area-score-pill.low  { background: #fee2e2; color: #b91c1c; }

    /* ── Complaints tracker card ─────────────────────────────── */
    .complaints-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .complaint-row {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color var(--transition);
    }
    .complaint-row:hover {
      border-color: var(--color-border-strong);
    }
    .complaint-ticket {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--color-primary-light);
      background: #dbeafe;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .complaint-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 2px;
    }
    .complaint-meta {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    @media (max-width: 768px) {
      .citizen-hero-card { flex-direction: column; align-items: flex-start; padding: 22px 20px; }
      .top-area-card { flex-direction: column; align-items: flex-start; }
      .top-area-score-box { text-align: left; }
      .rank-table th:nth-child(4), .rank-table td:nth-child(4),
      .rank-table th:nth-child(5), .rank-table td:nth-child(5) {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>

<script>
// ── Initialize App Shell ─────────────────────────────────────────
initPage({
  activeNav: 'citizen-dashboard',
  title: 'Citizen Community Dashboard',
  subtitle: 'Check neighbourhood cleanliness scores, live rankings & raise local civic reports.',
  showSearch: false,
});

// Render immediately with local data & re-render on Supabase sync
renderCitizenDashboard();
AppState.on('data-loaded', () => renderCitizenDashboard());
AppState.init();

function renderCitizenDashboard() {
  const body = document.getElementById('page-body');
  if (!body) return;

  const areas = [...AppState.areas].sort((a, b) => b.cleanlinessScore - a.cleanlinessScore);
  const topArea = areas[0] || { name: 'Gomti Nagar', ward: 'Ward 12', cleanlinessScore: 94, segregationScore: 96, collectionScore: 95 };

  // City-wide averages
  const avgScore = Math.round(areas.reduce((acc, a) => acc + a.cleanlinessScore, 0) / areas.length);
  const totalBins = AppState.bins.length;

  body.innerHTML = `
    <!-- ── Hero Greeting Banner ────────────────────────────────── -->
    <div class="citizen-hero-card">
      <div class="citizen-hero-content">
        <div class="citizen-hero-badge">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          Swachh Community Portal · Citizen Access
        </div>
        <div class="citizen-hero-title">Welcome to Your Neighbourhood Cleanliness Hub 🌿</div>
        <div class="citizen-hero-desc">
          Compare neighbourhood cleanliness scores, inspect smart waste bins on the live map, and report garbage overflows or civic issues directly to municipal collection teams.
        </div>
        <div class="citizen-hero-actions">
          <button class="btn btn-danger btn-sm" onclick="openComplaintModal()" style="display:inline-flex;align-items:center;gap:6px">
            ${Icons.complaint} Raise a Complaint
          </button>
          <a href="area-dashboard.html" class="btn btn-primary btn-sm" style="background:#2563a8;border-color:#3b82f6;display:inline-flex;align-items:center;gap:6px">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0120 10.2C20 17.5 12 22 12 22z"/><circle cx="12" cy="10" r="3"/></svg>
            Check Live Area Map
          </a>
          <button class="btn btn-outline btn-sm" onclick="openGuideModal()" style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2);display:inline-flex;align-items:center;gap:6px">
            ${Icons.guide} Waste Guide
          </button>
        </div>
      </div>
      <div style="display:none;md:block;font-size:4rem;opacity:0.9">
        🏙️
      </div>
    </div>

    <!-- ── Top Ranked Area Spotlight ────────────────────────────── -->
    <div class="top-area-card">
      <div class="top-area-left">
        <div class="top-trophy-box">🏆</div>
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="background:#fef08a;color:#854d0e;font-size:0.72rem;font-weight:800;padding:2px 8px;border-radius:4px;border:1px solid #facc15">#1 TOP PERFORMING AREA</span>
            <span style="font-size:0.75rem;color:#b45309;font-weight:600">Leader of the Month</span>
          </div>
          <div class="top-area-name">${topArea.name} · ${topArea.ward}</div>
          <div class="top-area-meta">
            ${topArea.segregationScore}% Segregation Rate · ${topArea.collectionScore}% Collection Efficiency · 0 Unattended Overflows
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:20px">
        <div class="top-area-score-box">
          <div class="top-area-score-val">${topArea.cleanlinessScore}<span style="font-size:1.1rem;color:#64748b;font-weight:600">/100</span></div>
          <div class="top-area-score-lbl">Cleanliness Score</div>
        </div>
        <button class="btn btn-accent btn-sm" onclick="viewAreaMap('${topArea.name}')" style="white-space:nowrap">
          View on Map →
        </button>
      </div>
    </div>

    <!-- ── City Overview KPIs ────────────────────────────────────── -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-normal">
        <div class="kpi-label">City Average Score</div>
        <div class="kpi-value">${avgScore}<span style="font-size:1.1rem;font-weight:500">/100</span></div>
        <div class="kpi-sub">Across 7 tracked community wards</div>
        <div class="kpi-icon">${Icons.chart}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Monitored Smart Bins</div>
        <div class="kpi-value">${totalBins}</div>
        <div class="kpi-sub">Real-time IoT ultrasonic fill sensors</div>
        <div class="kpi-icon kpi-info">${Icons.bins}</div>
      </div>
      <div class="kpi-card kpi-normal">
        <div class="kpi-label">Complaints Resolution</div>
        <div class="kpi-value">94%</div>
        <div class="kpi-sub">Average response under 4 hours</div>
        <div class="kpi-icon">${Icons.check}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Active Cleanliness Drives</div>
        <div class="kpi-value" style="color:var(--color-primary-light)">12</div>
        <div class="kpi-sub">Resident volunteer programs active</div>
        <div class="kpi-icon kpi-info">${Icons.people}</div>
      </div>
    </div>

    <!-- ── All Areas Rankings Table ─────────────────────────────── -->
    <div class="rank-table-card">
      <div class="rank-table-header">
        <div>
          <div class="card-title" style="display:flex;align-items:center;gap:8px">
            📊 Clean Neighbourhood Leaderboard
          </div>
          <div class="section-subtitle">Real-time cleanliness ranking of all municipal areas based on sensor data and collection rates.</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <input
            type="text"
            id="areaFilterInput"
            placeholder="Filter area or ward..."
            oninput="filterAreasTable(this.value)"
            style="padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:0.82rem;background:var(--color-bg);outline:none;width:180px"
          >
          <a href="rankings.html" class="btn btn-outline btn-sm" style="font-size:0.8rem">
            Full Rankings View →
          </a>
        </div>
      </div>

      <div style="overflow-x:auto">
        <table class="rank-table" id="citizenRankTable">
          <thead>
            <tr>
              <th style="width:70px">Rank</th>
              <th>Neighbourhood & Ward</th>
              <th>Cleanliness Score</th>
              <th>Trend</th>
              <th>Segregation</th>
              <th>Bins Status</th>
              <th style="text-align:right">Action</th>
            </tr>
          </thead>
          <tbody id="rankTableBody">
            ${renderAreaRows(areas)}
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── Complaints & Citizen Action Section ───────────────────── -->
    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:24px">
      
      <!-- Recent Community Complaints -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">📢 Community Reports & Grievance Tracker</div>
            <div class="section-subtitle">Recent issues reported by residents & current municipal action status</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="openComplaintModal()">
            + Raise Complaint
          </button>
        </div>
        <div class="card-body-lg">
          <div class="complaints-feed" id="complaintsFeed">
            ${renderComplaintsList()}
          </div>
        </div>
      </div>

      <!-- Quick Waste Segregation Guide & Tips -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">💡 Source Segregation Rules</div>
            <div class="section-subtitle">Help your area reach Rank #1</div>
          </div>
          <button class="btn btn-outline btn-xs" onclick="openGuideModal()">Details</button>
        </div>
        <div class="card-body-lg" style="display:flex;flex-direction:column;gap:12px">
          <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius-sm);padding:12px 14px">
            <div style="font-weight:700;color:#15803d;font-size:0.85rem;margin-bottom:3px">🟢 Green Bin: Wet Waste</div>
            <div style="font-size:0.78rem;color:#166534">Food scraps, vegetable peels, leaves, coffee grounds. No plastic bags!</div>
          </div>
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius-sm);padding:12px 14px">
            <div style="font-weight:700;color:#1d4ed8;font-size:0.85rem;margin-bottom:3px">🔵 Blue Bin: Dry Waste</div>
            <div style="font-size:0.78rem;color:#1e40af">Clean paper, plastic containers, glass, cardboard, metals.</div>
          </div>
          <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:12px 14px">
            <div style="font-weight:700;color:#b91c1c;font-size:0.85rem;margin-bottom:3px">🔴 Red Bin: Domestic Hazardous</div>
            <div style="font-size:0.78rem;color:#991b1b">Used batteries, paint, medicines, wrapped sanitary waste.</div>
          </div>
        </div>
      </div>

    </div>
  `;
}

function renderAreaRows(areasList) {
  const medals = ['🥇', '🥈', '🥉'];
  return areasList.map((area, index) => {
    const score = area.cleanlinessScore;
    const scoreClass = score >= 85 ? 'high' : score >= 70 ? 'med' : 'low';
    const trendText = area.trend === 'up'
      ? '<span style="color:#16a34a;font-weight:700">↑ Improving</span>'
      : area.trend === 'down'
      ? '<span style="color:#dc2626;font-weight:700">↓ Declining</span>'
      : '<span style="color:#94a3b8;font-weight:500">→ Stable</span>';

    return `
      <tr>
        <td>
          <span class="rank-medal-badge">
            ${index < 3 ? medals[index] : '#' + (index + 1)}
          </span>
        </td>
        <td>
          <div style="font-weight:750;color:var(--color-text);font-size:0.92rem">${area.name}</div>
          <div style="font-size:0.75rem;color:var(--color-text-muted)">${area.ward}</div>
        </td>
        <td>
          <span class="area-score-pill ${scoreClass}">${score}/100</span>
          <div style="width:100px;height:4px;background:#e2e8f0;border-radius:4px;margin-top:6px;overflow:hidden">
            <div style="width:${score}%;height:100%;background:${score >= 85 ? '#16a34a' : score >= 70 ? '#d97706' : '#dc2626'}"></div>
          </div>
        </td>
        <td>${trendText}</td>
        <td>
          <div style="font-weight:700;font-size:0.84rem">${area.segregationScore || 88}%</div>
          <div style="font-size:0.7rem;color:var(--color-text-muted)">Compliance</div>
        </td>
        <td>
          <div style="font-size:0.8rem;color:var(--color-text-secondary)">
            <span style="color:#16a34a;font-weight:700">${area.binsNormal || 2} Normal</span> · 
            <span style="color:${(area.pickupRequired || 0) > 0 ? '#dc2626' : '#94a3b8'};font-weight:700">${area.pickupRequired || 0} Alert</span>
          </div>
        </td>
        <td style="text-align:right">
          <button class="btn btn-outline btn-xs" onclick="viewAreaMap('${area.name}')" style="display:inline-flex;align-items:center;gap:4px">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0120 10.2C20 17.5 12 22 12 22z"/><circle cx="12" cy="10" r="3"/></svg>
            Live Map
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

function filterAreasTable(query) {
  const filtered = AppState.searchAreas(query);
  const tbody = document.getElementById('rankTableBody');
  if (tbody) {
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--color-text-muted)">No areas matching "${query}"</td></tr>`;
    } else {
      tbody.innerHTML = renderAreaRows(filtered);
    }
  }
}

function viewAreaMap(areaName) {
  sessionStorage.setItem('sm_selected_area', areaName);
  window.location.href = 'area-dashboard.html';
}

function renderComplaintsList() {
  const defaultComplaints = [
    { id: 'CMP-2026-8941', area: 'Gomti Nagar', category: 'Bin Overflow', location: 'Near Sector 2 Market Gate', status: 'Resolved', createdAt: 'Today, 10:15 AM' },
    { id: 'CMP-2026-8938', area: 'Indira Nagar', category: 'Illegal Dumping', location: 'Munshipulia Ring Road corner', status: 'In Progress', createdAt: 'Today, 08:30 AM' },
    { id: 'CMP-2026-8924', area: 'Aliganj', category: 'Damaged Sensor', location: 'Block C Community Park', status: 'Assigned', createdAt: 'Yesterday, 04:40 PM' },
    { id: 'CMP-2026-8910', area: 'Hazratganj', category: 'Bin Overflow', location: 'MG Road Near Metro Exit', status: 'Resolved', createdAt: 'Yesterday, 01:20 PM' },
  ];

  let userComplaints = [];
  try {
    userComplaints = JSON.parse(sessionStorage.getItem('sm_user_complaints') || '[]');
  } catch(e) {}

  const allComplaints = [...userComplaints, ...defaultComplaints].slice(0, 5);

  return allComplaints.map(c => {
    const isResolved = c.status === 'Resolved';
    const isProgress = c.status === 'In Progress';
    const badgeClass = isResolved ? 'badge-success' : isProgress ? 'badge-info' : 'badge-warning';

    return `
      <div class="complaint-row">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span class="complaint-ticket">#${c.id}</span>
            <span class="complaint-title">${c.category} · ${c.area}</span>
          </div>
          <div class="complaint-meta">
            📍 ${c.location} &nbsp;·&nbsp; 🕒 ${c.createdAt}
          </div>
        </div>
        <div>
          <span class="badge ${badgeClass}">${c.status}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderCitizenComplaints() {
  const feed = document.getElementById('complaintsFeed');
  if (feed) feed.innerHTML = renderComplaintsList();
}
</script>

</body>
</html>
