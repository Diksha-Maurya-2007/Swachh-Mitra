<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection Management – Swachh Mitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>

initPage({
  activeNav: 'collection',
  title: 'Collection Management',
  subtitle: 'Manage pickup tasks, assign teams, and track collection progress.',
  showSearch: true,
  searchPlaceholder: 'Search task, area...',
});

renderCollectionPage();
AppState.on('data-loaded', () => renderCollectionPage());
AppState.init();


function renderCollectionPage() {
  const body  = document.getElementById('page-body');
  const tasks = AppState.collectionTasks;

  const pending    = tasks.filter(t => t.status === 'Pending');
  const inProgress = tasks.filter(t => t.status === 'In Progress');
  const completed  = tasks.filter(t => t.status === 'Completed');

  body.innerHTML = `
    <!-- Status KPI -->
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px">
      <div class="kpi-card kpi-warning">
        <div class="kpi-label">Pending Pickups</div>
        <div class="kpi-value" style="font-size:2rem">${pending.length}</div>
        <div class="kpi-sub">Awaiting team assignment</div>
        <div class="kpi-icon">${Icons.clock}</div>
      </div>
      <div class="kpi-card kpi-info" style="--kpi-color:var(--color-primary-light)">
        <div class="kpi-label">In Progress</div>
        <div class="kpi-value" style="font-size:2rem;color:var(--color-primary-light)">${inProgress.length}</div>
        <div class="kpi-sub">Teams currently collecting</div>
        <div class="kpi-icon kpi-info">${Icons.truck}</div>
      </div>
      <div class="kpi-card kpi-normal">
        <div class="kpi-label">Completed Today</div>
        <div class="kpi-value" style="font-size:2rem">${completed.length}</div>
        <div class="kpi-sub">Successful pickups</div>
        <div class="kpi-icon">${Icons.check}</div>
      </div>
    </div>

    <!-- Task Table -->
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Collection Tasks</div>
          <div class="section-subtitle">All active and completed pickup tasks for today</div>
        </div>
        <div class="filter-bar" id="taskFilterBar">
          <button class="filter-btn active" onclick="filterTasks(this,'all')">All (${tasks.length})</button>
          <button class="filter-btn" onclick="filterTasks(this,'Pending')">Pending (${pending.length})</button>
          <button class="filter-btn" onclick="filterTasks(this,'In Progress')">In Progress (${inProgress.length})</button>
          <button class="filter-btn" onclick="filterTasks(this,'Completed')">Completed (${completed.length})</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" aria-label="Collection tasks">
          <thead>
            <tr>
              <th>Priority</th>
              <th>Bin #</th>
              <th>Area</th>
              <th>Fill Level</th>
              <th>Reason</th>
              <th>Assigned Team</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskTableBody">
            ${renderTaskRows(tasks)}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Search
  const searchInput = document.getElementById('globalSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = AppState.collectionTasks.filter(t => {
        const bin = AppState.getBinById(t.binId);
        return bin && (bin.binNumber.includes(q) || bin.area.toLowerCase().includes(q));
      });
      document.getElementById('taskTableBody').innerHTML = renderTaskRows(filtered);
    });
  }
}

function renderTaskRows(tasks) {
  if (tasks.length === 0) return `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--color-text-muted)">No tasks match this filter.</td></tr>`;

  return tasks.map(task => {
    const bin = AppState.getBinById(task.binId);
    if (!bin) return '';
    const isCompleted = task.status === 'Completed';

    return `
      <tr style="${isCompleted ? 'opacity:0.65' : ''}">
        <td>${getPriorityBadge(task.priority)}</td>
        <td class="font-bold">#${bin.binNumber}</td>
        <td>${bin.area}</td>
        <td>
          <div style="min-width:110px">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span class="fill-pct ${getStatusClass(bin.fillLevel)}" style="font-size:0.8rem">${bin.fillLevel}%</span>
            </div>
            ${buildProgressBar(bin.fillLevel)}
          </div>
        </td>
        <td class="td-muted" style="max-width:180px;white-space:normal;font-size:0.8rem">${task.reason}</td>
        <td>
          ${task.assignedTeam
            ? `<span class="badge badge-info">${task.assignedTeam}</span>`
            : `<span class="text-muted text-sm">—</span>`
          }
        </td>
        <td>${getTaskStatusBadge(task.status)}</td>
        <td>
          <div class="flex gap-8">
            ${!isCompleted && !task.assignedTeam ? `
              <button class="btn btn-sm btn-primary" onclick="openAssignModal(${task.id})" aria-label="Assign team to task ${task.id}">
                ${Icons.people} Assign
              </button>
            ` : ''}
            ${!isCompleted ? `
              <button class="btn btn-sm btn-success" onclick="handleMarkCollected(${task.id})" aria-label="Mark task ${task.id} as collected">
                ${Icons.check} Mark Collected
              </button>
            ` : `
              <span class="td-muted text-sm">
                ${Icons.check}
                ${task.completedAt ? new Date(task.completedAt).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) : 'Done'}
              </span>
            `}
            <button class="btn btn-ghost btn-xs" onclick="openBinModal(${bin.id})" aria-label="View bin ${bin.binNumber}">
              ${Icons.eye}
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function filterTasks(btn, filter) {
  document.querySelectorAll('#taskFilterBar .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = filter === 'all' ? AppState.collectionTasks : AppState.collectionTasks.filter(t => t.status === filter);
  document.getElementById('taskTableBody').innerHTML = renderTaskRows(filtered);
}

function handleMarkCollected(taskId) {
  AppState.markCollected(taskId);
  showToast('Pickup marked as completed. Bin fill level reset.', 'success');
  renderCollectionPage();
}

AppState.on('task-update', () => renderCollectionPage());
AppState.on('bin-update',  () => renderCollectionPage());
</script>
</body>
</html>
